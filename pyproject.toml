[project]
name = "julleditor"
version = "3.3.0"
description = "JullEditor — Generador profesional offline-first de artículos de blog con IBM Granite, análisis de sentencias TSJ, diseño Cyber-Legal LegalTech y despliegue multi-plataforma"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "playwright>=1.47.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.2",
    "aiofiles>=24.1.0",
    "textual>=0.80,<9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
