upstream granite_backend {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Frontend estático y endpoints generales de la API
    location / {
        proxy_pass http://granite_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint de streaming SSE en tiempo real (Crucial: sin buffering de Nginx)
    location /api/generate-stream {
        proxy_pass http://granite_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    # Health check ágil
    location /api/health {
        proxy_pass http://granite_backend;
        proxy_read_timeout 5s;
    }

    # Compresión gzip para recursos estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
