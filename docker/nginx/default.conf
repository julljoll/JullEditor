upstream granite_backend {
    server app:8000;
}

upstream astro_site {
    server app:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Las rutas Gemini viven en endpoints API de Astro, no en FastAPI.
    location = /api/ai-action {
        proxy_pass http://astro_site;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/ai-chat {
        proxy_pass http://astro_site;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/ai-status {
        proxy_pass http://astro_site;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy interno de Astro al backend, conservando el prefijo /api.
    location /backend-api/api/generate-stream {
        rewrite ^/backend-api(/.*)$ $1 break;
        proxy_pass http://granite_backend;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    location /backend-api/ {
        rewrite ^/backend-api(/.*)$ $1 break;
        proxy_pass http://granite_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compatibilidad de las rutas FastAPI existentes.
    location / {
        proxy_pass http://astro_site;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint de streaming SSE en tiempo real (Crucial: sin buffering de Nginx)
    location /api/generate-stream {
        proxy_pass http://granite_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://granite_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://granite_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://granite_backend;
        proxy_set_header Host $host;
    }

    # Health check ágil
    location /api/health {
        proxy_pass http://granite_backend;
        proxy_read_timeout 5s;
    }

    # Compresión gzip para recursos estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
