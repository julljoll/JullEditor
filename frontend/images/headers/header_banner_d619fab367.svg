<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Gradientes Cyber-Legal Blueprint -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d3000"/>
      <stop offset="45%" stop-color="#191a14"/>
      <stop offset="100%" stop-color="#0c0d0c"/>
    </linearGradient>
    
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FECF06" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Patrón de Cuadrícula Pericial de Seguridad -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(254, 207, 6, 0.06)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Fondo Principal -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Marco Pericial Cyber-Legal Exterior (16:9) -->
  <rect x="25" y="25" width="1150" height="625" fill="none" stroke="rgba(254, 207, 6, 0.22)" stroke-width="1.2"/>
  <rect x="35" y="35" width="1130" height="605" fill="none" stroke="rgba(0, 255, 65, 0.12)" stroke-width="0.8" stroke-dasharray="6,4"/>

  <!-- Esquinas Técnicas de Marcaje Pericial -->
  <path d="M 25 55 L 25 25 L 55 25" fill="none" stroke="#FECF06" stroke-width="3"/>
  <path d="M 1175 55 L 1175 25 L 1145 25" fill="none" stroke="#FECF06" stroke-width="3"/>
  <path d="M 25 620 L 25 650 L 55 650" fill="none" stroke="#FECF06" stroke-width="3"/>
  <path d="M 1175 620 L 1175 650 L 1145 650" fill="none" stroke="#FECF06" stroke-width="3"/>

  <!-- Líneas Dinámicas y Circuitos Abstractos -->
  <g opacity="0.85">
    <line x1="800" y1="120" x2="1120" y2="120" stroke="rgba(0, 255, 65, 0.3)" stroke-width="1"/>
    <line x1="800" y1="520" x2="1120" y2="520" stroke="rgba(254, 207, 6, 0.3)" stroke-width="1"/>
    <circle cx="850" cy="140" r="3.5" fill="#FECF06" opacity="0.6"/>
<line x1="850" y1="140" x2="890" y2="165" stroke="#FECF06" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35"/>
<circle cx="938" cy="157" r="3.5" fill="#FECF06" opacity="0.6"/>
<line x1="938" y1="157" x2="978" y2="182" stroke="#FECF06" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35"/>
<circle cx="1026" cy="144" r="3.5" fill="#FECF06" opacity="0.6"/>
<line x1="1026" y1="144" x2="1066" y2="169" stroke="#FECF06" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35"/>
<circle cx="1114" cy="161" r="3.5" fill="#FECF06" opacity="0.6"/>
<line x1="1114" y1="161" x2="1154" y2="186" stroke="#FECF06" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35"/>
<circle cx="862" cy="258" r="3.5" fill="#FECF06" opacity="0.6"/>
<line x1="862" y1="258" x2="902" y2="283" stroke="#FECF06" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35"/>
<circle cx="950" cy="275" r="3.5" fill="#FECF06" opacity="0.6"/>
<line x1="950" y1="275" x2="990" y2="300" stroke="#FECF06" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35"/>
<circle cx="1038" cy="262" r="3.5" fill="#FECF06" opacity="0.6"/>
<line x1="1038" y1="262" x2="1078" y2="287" stroke="#FECF06" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35"/>
<circle cx="1086" cy="279" r="3.5" fill="#FECF06" opacity="0.6"/>
<line x1="1086" y1="279" x2="1126" y2="304" stroke="#FECF06" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35"/>
<circle cx="874" cy="376" r="3.5" fill="#FECF06" opacity="0.6"/>
<line x1="874" y1="376" x2="914" y2="401" stroke="#FECF06" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35"/>
<circle cx="962" cy="363" r="3.5" fill="#FECF06" opacity="0.6"/>
<line x1="962" y1="363" x2="1002" y2="388" stroke="#FECF06" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35"/>
<circle cx="1010" cy="380" r="3.5" fill="#FECF06" opacity="0.6"/>
<line x1="1010" y1="380" x2="1050" y2="405" stroke="#FECF06" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35"/>
<circle cx="1098" cy="367" r="3.5" fill="#FECF06" opacity="0.6"/>
<line x1="1098" y1="367" x2="1138" y2="392" stroke="#FECF06" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35"/>

    <!-- Símbolo Abstracto de Balance / Balanza Legal y Criptografía -->
    <circle cx="980" cy="320" r="95" fill="none" stroke="rgba(254, 207, 6, 0.15)" stroke-width="1.5"/>
    <circle cx="980" cy="320" r="65" fill="none" stroke="rgba(0, 255, 65, 0.2)" stroke-width="1" stroke-dasharray="4,4"/>
    <polygon points="980,245 1045,355 915,355" fill="none" stroke="#FECF06" stroke-width="1.2" opacity="0.4"/>
    <line x1="980" y1="230" x2="980" y2="390" stroke="#00FF41" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Tag y Badge Temático Superior -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="460" height="34" rx="6" fill="rgba(0, 0, 0, 0.65)" stroke="#00FF41" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#00FF41"/>
    <text x="34" y="22" font-family="'Consolas', 'Fira Code', monospace" font-size="13" font-weight="700" fill="#00FF41" letter-spacing="1">
      SEGURIDAD PERICIAL & DELITOS INFORMÁTICOS
    </text>
  </g>

  <!-- Título Principal del Artículo (Arial Bold) -->
  <g transform="translate(80, 210)">
    <text x="0" y="45" font-family="'Arial', sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      Ley de Delitos Informaticos y Ciberseguridad
    </text>
    <text x="0" y="105" font-family="'Arial', sans-serif" font-size="38" font-weight="700" fill="#FFFFFF" opacity="0.95">en Venezuela</text>
  </g>

  <!-- Barra Decorativa Divisoria -->
  <rect x="80" y="375" width="580" height="3" fill="url(#goldGlow)" rx="1.5"/>

  <!-- Sub-Badge y Jurisdicción Venezolana -->
  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="520" height="38" rx="6" fill="rgba(254, 207, 6, 0.10)" stroke="rgba(254, 207, 6, 0.35)" stroke-width="1"/>
    <text x="20" y="24" font-family="'Arial', sans-serif" font-size="14" font-weight="700" fill="#FECF06" letter-spacing="0.4">
      ⚖️ LEY ESP. DELITOS INFORMÁTICOS · SUSCERTE
    </text>
  </g>

  <!-- Metadatos de Pie de Cabecera (Terminal Monospace) -->
  <g transform="translate(80, 575)">
    <text x="0" y="0" font-family="'Consolas', 'Fira Code', monospace" font-size="13" fill="#AEAEB2">
      MARCO EDITORIAL: <tspan fill="#00FF41">SHA256.US LEGAL-TECH</tspan> | PROCESADOR: <tspan fill="#FECF06">IBM GRANITE 3.3 (CPU)</tspan> | FORMATO: <tspan fill="#9DFF00">16:9 SEO</tspan>
    </text>
  </g>
</svg>